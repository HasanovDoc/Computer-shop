version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: computer_store
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: backend_password
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "5000:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
